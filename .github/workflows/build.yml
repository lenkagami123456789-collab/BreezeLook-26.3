name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # The repo has no gradlew scripts, so install Gradle directly
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          # Surface the tail of the Gradle log as an annotation
          msg=$(grep -vE '^\s*$' build.log | tail -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle build failed::${msg}"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: breezelook-26.3
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
